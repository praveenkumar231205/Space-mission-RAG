name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The tests use fake embedder/LLM classes, so only numpy + pytest are needed.
      - run: pip install numpy pytest
      - run: pytest -q
